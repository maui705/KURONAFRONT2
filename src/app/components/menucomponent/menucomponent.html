<div class="container">
 <mat-toolbar class="custom-toolbar">
  <button
   matButton
   class="btn-rojo"
   aria-label="Example icon-button with menu icon"
   [matMenuTriggerFor]="menuUsuario"
  >
  <mat-icon>android</mat-icon> 
  Usuario
  </button>

  <button
   matButton
   class="btn-rojo"
   aria-label="Example icon-button with menu icon"
   [matMenuTriggerFor]="menuRol"
  >
  <mat-icon>android</mat-icon> 
  Rol
  </button>

 </mat-toolbar>

 <mat-menu #menuUsuario="matMenu">
    <button mat-menu-item 
    routerLink="/usuario/registrar-usuario">
    <mat-icon>add</mat-icon>
    Registrar
    </button>

    <button mat-menu-item 
    routerLink="/usuario/listar-usuario">
    <mat-icon>list</mat-icon>
    Lista
    </button>
 </mat-menu>

  <mat-menu #menuRol="matMenu">
    <button mat-menu-item 
    routerLink="/rol/registrar-rol">
    <mat-icon>add</mat-icon>
    Registrar
    </button>

    <button mat-menu-item 
    routerLink="/rol/listar-rol">
    <mat-icon>list</mat-icon>
    Lista
    </button>
 </mat-menu>

</div>
