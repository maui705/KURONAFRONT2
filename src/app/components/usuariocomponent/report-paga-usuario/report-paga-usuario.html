<div class="container">
  <h2>Reporte de Pagos Totales por Usuario</h2>

  <mat-form-field appearance="outline" class="example-full-width">
    <mat-label>Buscar usuario</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ingrese nombre o apellido">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Username -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef> Username </th>
      <td mat-cell *matCellDef="let pago"> {{ pago.username }} </td>
    </ng-container>

    <!-- Apellido -->
    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef> Apellido </th>
      <td mat-cell *matCellDef="let pago"> {{ pago.apellido }} </td>
    </ng-container>

    <!-- Pago Total -->
    <ng-container matColumnDef="pagoTotal">
      <th mat-header-cell *matHeaderCellDef> Pago Total </th>
      <td mat-cell *matCellDef="let pago"> {{ pago.pagoTotal | currency:'PEN ':'symbol' }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
