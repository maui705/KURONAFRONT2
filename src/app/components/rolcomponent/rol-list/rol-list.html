<div class="container">
    <h2>Lista de roles</h2>
    <div>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="c1">
                <th mat-header-cell *matHeaderCellDef>RolId</th>

                <td mat-cell *matCellDef="let element">{{ element.rolId }}</td>
            </ng-container>


            <ng-container matColumnDef="c2">
                <th mat-header-cell *matHeaderCellDef>Rol</th>

                <td mat-cell *matCellDef="let element">{{ element.rol }}</td>
            </ng-container>


            <ng-container matColumnDef="c3">
                <th mat-header-cell *matHeaderCellDef>Descripcion</th>

                <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
            </ng-container>


            <ng-container matColumnDef="c4">
                <th mat-header-cell *matHeaderCellDef>Sueldo</th>

                <td mat-cell *matCellDef="let element">{{ element.sueldo }}</td>
            </ng-container>


            <ng-container matColumnDef="c5">
                <th mat-header-cell *matHeaderCellDef>Permisos</th>

                <td mat-cell *matCellDef="let element">{{ element.permisos }}</td>
            </ng-container>


             <ng-container matColumnDef="c6">
                <th mat-header-cell *matHeaderCellDef>Fecha Creacion</th>

                <td mat-cell *matCellDef="let element">{{ element.fechaCreacion | date:'dd/MM/yyyy'}}</td>
            </ng-container>

            

             <ng-container matColumnDef="c7">
                <th mat-header-cell *matHeaderCellDef>Usuario ID</th>

                <td mat-cell *matCellDef="let element">{{ element.user_id }}</td>
            </ng-container> 
            

            <!-- Delete -->
            <ng-container matColumnDef="c8">
                <th mat-header-cell *matHeaderCellDef> Eliminar </th>
                <td mat-cell *matCellDef="let element"> 
                        <button matButton (click)="eliminar(element.rolId)" class = "btn-eliminar">
                            <mat-icon>delete</mat-icon>
                        </button>
                </td>
            </ng-container>


            <!-- Update -->
          <ng-container matColumnDef="c9">
                <th mat-header-cell *matHeaderCellDef> Actualizar </th>
                <td mat-cell *matCellDef="let element"> 
                        <button matButton [routerLink] = "['/rol/actualizar-rol', element.rolId]" class = "btn-actualizar">
                            <mat-icon>edit</mat-icon>
                        </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        </table>
    </div>
</div>
